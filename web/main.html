<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Gestión</title>
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body class="tema-oscuro">
    <div class="cinta-noticias">
      <div class="cinta-texto"> 
        GESTIÓN DE EVENTOS • CONSULTA TUS ENTRADAS • ARTISTAS CONFIRMADOS • 
      </div>
    </div>

    <div class="contenedor-general">
      <nav class="barra-navegacion">
        <button class="nav-btn activo" data-target="seccion-eventos">Cartelera Eventos</button>
        <button class="nav-btn" data-target="seccion-artistas">Artistas</button>
        <button class="nav-btn" data-target="seccion-entradas">Mis Entradas</button>
        <div class="grupo-tema" style="margin-top: 20px;">
            <button id="btn-tema-oscuro" class="btn-tema">Modo Noche</button>
            <button id="btn-tema-claro" class="btn-tema">Modo Día</button>
        </div>
        <button id="btn-volver" style="margin-top: auto; background-color: #ff007f; color: white;">Cerrar Sesión</button>
      </nav>

      <div class="cont-sec">
        <main id="seccion-eventos" class="panel-contenido activo">
            <header class="cabecera-top">
                <h1 class="titulo-principal">Próximos Eventos</h1>
            </header>
            <div id="contenedor-eventos" style="padding: 20px;">
                </div>
        </main>

        <main id="seccion-artistas" class="panel-contenido">
            <header class="cabecera-top">
                <h1 class="titulo-principal">Nuestros Artistas</h1>
            </header>
            <div class="seccion-busqueda">
                <input type="text" id="input-buscar" placeholder="Buscar artista..." />
                <button id="btn-buscar">Buscar</button>
            </div>
            <div id="contenedor-tarjetas"></div>
        </main>

        <main id="seccion-entradas" class="panel-contenido">
            <header class="cabecera-top">
                <h1 class="titulo-principal">Mis Entradas</h1>
            </header>
            <div id="contenedor-mis-entradas" style="padding: 20px;">
                <p style="text-align:center; color:#ccc;">No tienes compras registradas.</p>
            </div>
        </main>

        <footer class="pie-pagina">
          <p>PROYECTO INTERMODULAR - Alfonso y Víctor</p>
          <p>&copy; 2026 GESTIÓN DE EVENTOS. Todos los derechos reservados.</p>
        </footer>
      </div>
    </div>

    <div id="ventana-modal-info" class="ventana-modal">
      <div class="modal-contenido">
        <h2 id="info-titulo">Nombre Artista</h2>
        <img id="info-imagen" src="" alt="Artista" style="width: 100%; height: 200px; object-fit: cover; border-radius: 8px; border: 2px solid #00f0ff; margin-bottom: 10px;">
        <p id="info-descripcion" style="color: #ccc; line-height: 1.5; margin-bottom: 15px; text-align: justify;"></p>
        <button id="btn-cerrar-info">Cerrar</button>
      </div>
    </div>

    <script src="script/script.js"></script>
  </body>
</html>
